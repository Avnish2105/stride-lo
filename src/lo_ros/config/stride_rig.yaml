# lo_sim Gazebo sensor rig (~0.5 m quadruped body, Mid-360 front-top, dome up, 20 deg down).
stride_lo:
  ros__parameters:
    topics:
      lidar: /livox/lidar
      imu: /livox/imu
      joints: /joint_states
    frames:
      base: base
      lidar: livox_frame
      imu: livox_frame
    imu:
      accel_scale: 9.80665
    self_filter:
      body_box: [-0.40, -0.22, -0.15, 0.42, 0.22, 0.20]
      robot_description_topic: /robot_description
    extrinsics:
      source: tf
    clock:
      # lo_sim's arrival-based skew proxy also sees the rig's own release timing and DDS delivery
      # on a loaded host: up to 3 ms with the Gazebo + RViz GUIs in software GL (crowd, after the
      # rig's look-ahead release; 20-69 ms before it). 2 ms would fire on that. Keep the check
      # (off, a 50 ms LiDAR offset gave 38 false accepts) with margin above it (DECISIONS I37).
      max_skew: 0.015
