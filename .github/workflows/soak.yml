# 8 h of synthetic data through one pipeline (DECISIONS I16): memory flat within +-5 %,
# 0 false accepts. Manual or nightly.
name: soak
on:
  workflow_dispatch:
    inputs:
      hours:
        description: hours of synthetic data
        default: '8'
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: ['feat/**']   # only when the head commit message contains [soak]
jobs:
  soak:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[soak]')
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      BUILD_JOBS: 2
      STRIDE_BAGS_DIR: ${{ github.workspace }}/.no_bags
    steps:
      - uses: actions/checkout@v4
      - id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"
          mkdir -p "$STRIDE_BAGS_DIR"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ci
          tags: stride-lo:ci
          load: true
          cache-from: type=gha,scope=stride-ci
          build-args: |
            BUILD_JOBS=2
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}
      - run: scripts/dc run --rm ci scripts/build.sh
      - name: Soak
        run: >
          scripts/dc run --rm ci bash -c 'source install/setup.bash &&
          ros2 run lo_tools soak.py --hours ${{ github.event.inputs.hours || 8 }}'
